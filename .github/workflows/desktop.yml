name: Desktop builds

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run typecheck
      - run: npm run fmt:ui
      - run: npm run test:ui
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:video

  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            rust-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - run: npm run build:ui
      - run: npm run check:ui
      - run: npm run test:ui
      - run: npm run prepare:video
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          (cargo test --manifest-path src-tauri/Cargo.toml --locked && cargo test --manifest-path src-tauri/Cargo.toml --locked --lib native_process_round_trip -- --ignored) 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            details="$(tail -n 35 "$RUNNER_TEMP/cargo-test.log")"
            if [ "${#details}" -gt 3000 ]; then details="${details: -3000}"; fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Rust tests failed::$details"
          fi
          exit "$result"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test video_probe_native -- --ignored
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib packaged_ffprobe_restores_recent_video -- --ignored
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib packaged_subtitles_reach_renderer -- --ignored
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Remove cached installers before building
        run: |
          node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.target }}/release/bundle', { recursive: true, force: true })"
      - run: npm run build:video -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify macOS app signature and packaged disk image
        if: runner.os == 'macOS'
        run: node scripts/verify-macos.mjs "src-tauri/target/${{ matrix.target }}/release/bundle" "${{ matrix.target }}"
      - name: Verify packaged macOS video tool
        if: runner.os == 'macOS'
        run: node scripts/verify-video-bundle.mjs "src-tauri/target/${{ matrix.target }}/release/bundle/macos/小米音乐投送.app" "${{ matrix.target }}"
      - name: Install and verify Windows release in disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Installer verification is restricted to disposable GitHub-hosted runners.'
          }
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $registryRoots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          foreach ($registryRoot in $registryRoots) {
            $existing = Get-ItemProperty $registryRoot -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq $config.productName }
            if ($existing) { throw 'An existing application installation must not be changed by this test.' }
          }
          if (Get-Process -Name 'xiaomi-dlna-desktop' -ErrorAction SilentlyContinue) {
            throw 'A running application must not be interrupted by this test.'
          }
          $installers = @(Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one fresh NSIS installer.' }
          $installDir = Join-Path $env:RUNNER_TEMP ('video-bundle-' + [guid]::NewGuid().ToString('N') + ' 中文')
          function Run-BoundedInstaller($file, $arguments) {
            $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(180000)) {
              $process.Kill($true)
              $process.WaitForExit()
              throw 'Installer process exceeded its deadline.'
            }
            if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }
          }
          try {
            # NSIS /D must be last and unquoted, including when the path has spaces.
            # /NS suppresses shortcuts; omitting /R prevents launching the application.
            Run-BoundedInstaller $installers[0].FullName "/S /NS /D=$installDir"
            node scripts/verify-video-bundle.mjs "$installDir" '${{ matrix.target }}'
            if ($LASTEXITCODE -ne 0) { throw 'Installed video bundle verification failed.' }
          } finally {
            try {
              $uninstaller = Join-Path $installDir 'uninstall.exe'
              if (Test-Path -LiteralPath $uninstaller) {
                # _?= prevents the uninstaller from detaching into a temporary copy.
                Run-BoundedInstaller $uninstaller "/S _?=$installDir"
              }
            } finally {
              if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
            }
          }
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-music-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: desktop
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: xiaomi-music-*
          path: release-artifacts
      - name: Validate and stage installers
        run: node scripts/prepare-release.mjs release-artifacts release-out
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: node scripts/publish-release.mjs release-out
