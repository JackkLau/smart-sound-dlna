name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - run: npm ci
      - run: npm run check:ui
      - run: npm run test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            details="$(tail -n 90 "$RUNNER_TEMP/cargo-test.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Rust tests failed::$details"
          fi
          exit "$result"
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-music-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
