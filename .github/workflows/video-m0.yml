name: Video M0 preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/video-m0.yml'

permissions:
  contents: read

concurrency:
  group: video-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: video-m0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            video-m0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:ui
      - run: npm run test:ui
      - run: npm run build:ui
      - run: npm run prepare:video
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib native_process_round_trip -- --ignored
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test video_probe_native -- --ignored
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: npm run build:video -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify macOS preview bundle
        if: runner.os == 'macOS'
        run: node scripts/verify-macos.mjs "src-tauri/target/${{ matrix.target }}/release/bundle" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-m0-preview-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
