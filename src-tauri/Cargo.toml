[package]
name = "xiaomi-dlna-desktop"
version = "0.7.2"
edition = "2021"
rust-version = "1.90"
description = "Local music casting for Xiaomi DLNA speakers"

[lib]
name = "xiaomi_dlna_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "xiaomi-dlna-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "login_window_regression"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:keyring"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
roxmltree = "0.20"
if-addrs = "0.14"
socket2 = "0.6"
futures-util = "0.3"
url = "2"
axum = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
md5 = "0.7"
base64 = "0.22"
ring = "0.17"
tempfile = "3"
lofty = "0.25.4"
keyring = { version = "=3.6.3", optional = true, features = ["apple-native", "windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
